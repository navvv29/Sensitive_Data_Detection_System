version: '3.8'

services:
  backend:
    build: .
    container_name: sensitive_data_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      # Pass API keys via environment variables or a .env file
    env_file:
      - .env

  frontend:
    build: 
      context: ./frontend
    container_name: sensitive_data_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
