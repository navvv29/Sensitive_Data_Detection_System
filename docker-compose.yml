version: '3.8'

services:
  app:
    build: .
    container_name: sensitive_data_assistant
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      # Pass API keys via environment variables or a .env file
    env_file:
      - .env
